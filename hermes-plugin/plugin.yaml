name: pebble
version: 1.1.0
description: >
  Full Pebble communication protocol. All outbound messages go through the
  pebble_send tool (text, UI blocks, session status, pushes). Inbound
  ui_action payloads are parsed and injected as structured context via
  pre_llm_call so the agent treats UI taps as responses, not free text.
provides_tools:
  - pebble_send
provides_hooks:
  - pre_llm_call
